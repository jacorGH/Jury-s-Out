# Keeps content/manifest.json in sync with whatever is in content/.
#
# The game can only load pack files listed in the manifest, because static
# hosting can't list a directory. This means you can add a case from a phone
# without remembering to edit the manifest by hand.

name: Update content manifest

on:
  push:
    paths:
      - 'content/**'
      - '!content/manifest.json'   # our own commit must not retrigger this
      - 'tools/build-manifest.js'
  workflow_dispatch:                # lets you run it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    # Second guard against a loop: ignore pushes this workflow made itself.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild manifest
        run: node tools/build-manifest.js

      - name: Commit if it changed
        run: |
          if git diff --quiet -- content/manifest.json; then
            echo "manifest.json already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/manifest.json
          git commit -m "Update content manifest [skip ci]"
          git push
